name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: native
          - name: windows-x86_64
            os: ubuntu-latest
            target: x86_64-windows-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-macos
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Linux deps
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libgl1-mesa-dev
      - name: Build
        run: zig build -Dtarget=${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist/pvo
          cp -R zig-out/bin/* dist/pvo/
          rm -f dist/pvo/*.pdb
          cp README.md dist/pvo/
          cd dist && zip -qr ../pvo-${{ matrix.name }}.zip pvo
      - uses: actions/upload-artifact@v4
        with:
          name: pvo-${{ matrix.name }}
          path: pvo-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" out/*.zip --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
